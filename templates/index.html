{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="/static/css/style.css">
	<script src="/static/js/htmx.js"></script>
	<script src="/static/js/navbutton.js" defer></script>
	<title>Nyatt's blog</title>
</head>
<body hx-on::after:swap="window.scrollTo(0, 0)">
	<header class="site-header">
		<a href="/" class="logo">
			<img src="/static/images/logo.png" alt="Nyatt's blog">
			<span><strong>Nyatt's Blog</strong></span>
		</a>

		<!--
			Responsive navigation button:
			- id="menu-toggle" lets navbutton.js find and control this button.
			- class="menu-toggle" lets CSS style it as a hamburger button.
			- type="button" prevents accidental form submission.
			- aria-controls identifies the navigation controlled by this button.
			- aria-expanded starts as false and changes when the menu opens.
			- aria-label describes the button for screen readers.
			- The ☰ character is the visible hamburger icon.
		-->
		<button id="menu-toggle" class="menu-toggle" type="button"
			aria-controls="main-nav" aria-expanded="false" aria-label="Open navigation">
			☰
		</button>

		<nav id="main-nav" class="main-nav">
			<button id="menu-close" class="menu-close" type="button"
				aria-label="Close navigation">×</button>

			<a href="/"
			   hx-get="/"
			   hx-target="#content"
			   hx-swap="innerHTML"
			   hx-push-url="true">
				<strong>Home</strong>
			</a>

			<a href="/about"
			   hx-get="/about"
			   hx-target="#content"
			   hx-swap="innerHTML"
			   hx-push-url="true">
				<strong>About</strong>
			</a>

			<a href="/posts"
			   hx-get="/posts"
			   hx-target="#content"
				hx-swap="innerHTML"
				hx-push-url="true">
				<strong>Posts</strong>
			</a>

			<button id="theme-toggle" class="theme-toggle" type="button"
				aria-label="Switch to dark mode">
				<span id="theme-icon" aria-hidden="true">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round">
						<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"
							fill="currentColor" fill-opacity="0.2"></path>
					</svg>
				</span>
				<span id="theme-label"><strong>Dark mode</strong></span>
			</button>
		</nav>
	</header>
		
	<main id="content">
		{{template "content" .}}
	</main>

	<footer class="site-footer">
		<div class="footer-inner">
			<div class="footer-brand">
				<strong>Nyatt's Blog</strong>
				<span>Writing, learning, and building useful things.</span>
			</div>

			<nav class="footer-nav" aria-label="Footer navigation">
				<a href="/" hx-get="/" hx-target="#content" hx-swap="innerHTML" hx-push-url="true">Home</a>
				<a href="/about" hx-get="/about" hx-target="#content" hx-swap="innerHTML" hx-push-url="true">About</a>
				<a href="/posts" hx-get="/posts" hx-target="#content" hx-swap="innerHTML" hx-push-url="true">Posts</a>
			</nav>

			<small>© Nyatt's Blog</small>
		</div>
	</footer>

</body>
</html>
{{end}}
